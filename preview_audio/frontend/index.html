<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body { margin: 0; padding: 0; background: transparent; }
    audio { width: 100%; height: 40px; display: block; }
  </style>
</head>
<body>
  <audio id="a" controls preload="auto"></audio>
  <script>
    const Streamlit = {
      RENDER_EVENT: "streamlit:render",
      events: { _fns: [], addEventListener: function (type, fn) { this._fns.push(fn); } },
      _send: function (msg) {
        window.parent.postMessage(Object.assign({ isStreamlitMessage: true }, msg), "*");
      },
      setComponentReady: function () { this._send({ type: "streamlit:componentReady", apiVersion: 1 }); },
      setFrameHeight: function (height) { this._send({ type: "streamlit:setFrameHeight", height: height }); },
      setComponentValue: function (value) { this._send({ type: "streamlit:setComponentValue", value: value, dataType: "json" }); }
    };
    window.addEventListener("message", function (event) {
      const data = event.data || {};
      if (data.type !== "streamlit:render") return;
      Streamlit.events._fns.forEach(function (fn) {
        fn({ detail: { args: data.args || {} } });
      });
    });

    const audio = document.getElementById("a");
    audio.loop = true;
    let lastRev = null;
    let lastB64 = "";
    let pendingB64 = null;
    const PREVIEW_CH = "midi_gen_preview_clock";
    let clockCh = null;
    try { clockCh = new BroadcastChannel(PREVIEW_CH); } catch (e) { clockCh = null; }

    function applySrc(b64) {
      if (!b64 || b64 === lastB64) return;
      lastB64 = b64;
      audio.src = "data:audio/wav;base64," + b64;
    }

    function postClock() {
      if (clockCh) {
        clockCh.postMessage({
          t: audio.currentTime || 0,
          playing: !audio.paused && !audio.ended,
          at: performance.now(),
        });
      }
      requestAnimationFrame(postClock);
    }

    function onRender(event) {
      const args = event.detail.args || {};
      const b64 = args.wav_b64 || "";
      const rev = Number(args.rev) || 0;
      const force = lastRev === null || rev !== lastRev;
      lastRev = rev;
      if (!b64) return;
      if (force || audio.paused || audio.ended) {
        pendingB64 = null;
        applySrc(b64);
        if (force) audio.play().catch(function () {});
        return;
      }
      if (b64 !== lastB64) pendingB64 = b64;
    }

    audio.addEventListener("ended", function () {
      if (!pendingB64) return;
      applySrc(pendingB64);
      pendingB64 = null;
    });

    Streamlit.events.addEventListener(Streamlit.RENDER_EVENT, onRender);
    Streamlit.setComponentReady();
    Streamlit.setFrameHeight(48);
    requestAnimationFrame(postClock);
  </script>
</body>
</html>
